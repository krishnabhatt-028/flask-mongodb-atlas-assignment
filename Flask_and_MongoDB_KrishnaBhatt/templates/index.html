<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Flask & MongoDB</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav class="navbar"><div class="brand">Flask<span>DB</span></div><div class="nav-links"><a href="/">Home</a><a href="/api" target="_blank">API</a></div></nav>
<main class="container"><section class="hero"><p class="eyebrow">DEVOPS ASSIGNMENT</p><h1>Flask & MongoDB Atlas</h1><p>Submit your details through this Flask form and store them in MongoDB Atlas.</p></section>
<section class="card"><h2>Submit Data</h2>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form action="{{ url_for('submit_form') }}" method="POST">
<label for="name">Name</label><input id="name" name="name" type="text" value="{{ form_data.name if form_data else '' }}" placeholder="Enter your name" required>
<label for="email">Email</label><input id="email" name="email" type="email" value="{{ form_data.email if form_data else '' }}" placeholder="Enter your email" required>
<label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Enter your message" required>{{ form_data.message if form_data else '' }}</textarea>
<button type="submit">Save to MongoDB Atlas</button></form></section></main></body></html>
